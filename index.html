<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Соседи — вход</title>
  <meta name="description" content="Сервис обмена вещами и услугами между студентами общежития">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="bg-shade" aria-hidden="true"></div>

  <main class="auth">
      <div class="card" id="card">
        <div class="card-glow" id="glow"></div>

        <div class="brand">
          <img src="assets/favicon.svg" alt="">
          <div><b>СОСЕДИ</b><small>обмен в общежитии</small></div>
        </div>

        <div class="tabs" role="tablist">
          <button class="tab active" data-tab="login" role="tab">Вход</button>
          <button class="tab" data-tab="register" role="tab">Регистрация</button>
          <span class="tab-ind" id="tabInd"></span>
        </div>

        <!-- Вход -->
        <form id="loginForm" class="form" novalidate>
          <label class="field">
            <input type="email" name="email" placeholder=" " autocomplete="email" required>
            <span>Email</span>
            <i class="ico">✉️</i>
          </label>
          <label class="field">
            <input type="password" name="pass" placeholder=" " autocomplete="current-password" required>
            <span>Пароль</span>
            <i class="ico">🔒</i>
            <button type="button" class="eye" aria-label="Показать пароль">👁</button>
          </label>
          <div class="row">
            <label class="check"><input type="checkbox" name="remember" checked><i></i> Запомнить меня</label>
            <a href="#" class="link" id="forgot">Забыли пароль?</a>
          </div>
          <p class="err" id="loginErr"></p>
          <button class="btn primary" type="submit"><span class="lbl">Войти</span><span class="spin"></span><span class="tick">✓</span></button>
          <div class="divider"><span>или</span></div>
          <button class="btn ghost" type="button" id="demoBtn">⚡ Войти в демо-аккаунт</button>
        </form>

        <!-- Регистрация -->
        <form id="regForm" class="form hidden" novalidate>
          <label class="field">
            <input type="text" name="fullname" placeholder=" " autocomplete="name" required>
            <span>Имя и фамилия</span>
            <i class="ico">🙂</i>
          </label>
          <label class="field">
            <input type="email" name="email" placeholder=" " autocomplete="email" required>
            <span>Email</span>
            <i class="ico">✉️</i>
          </label>
          <div class="two">
            <label class="field">
              <select name="bld" required>
                <option value="1">Корпус 1</option><option value="2">Корпус 2</option>
                <option value="3">Корпус 3</option><option value="4">Корпус 4</option>
              </select>
              <i class="ico">🏢</i>
            </label>
            <label class="field">
              <input type="text" name="room" placeholder=" " inputmode="numeric" required>
              <span>Комната</span>
              <i class="ico">🚪</i>
            </label>
          </div>
          <label class="field">
            <input type="password" name="pass" placeholder=" " autocomplete="new-password" required minlength="6">
            <span>Пароль (от 6 символов)</span>
            <i class="ico">🔒</i>
            <button type="button" class="eye" aria-label="Показать пароль">👁</button>
          </label>
          <div class="strength"><i></i><i></i><i></i><i></i><small id="strengthTxt"></small></div>
          <p class="err" id="regErr"></p>
          <button class="btn primary" type="submit"><span class="lbl">Создать аккаунт</span><span class="spin"></span><span class="tick">✓</span></button>
        </form>

        <div class="foot">
          <span>Русский (ru)</span>
          <span>Учебный проект · 2026</span>
        </div>
      </div>
  </main>

  <div class="reveal" id="reveal"></div>
  <div class="toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
